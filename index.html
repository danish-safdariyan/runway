<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Runway</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Runway">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1917" media="(prefers-color-scheme: dark)">
<style>
:root{
  --paper:#EEF3F1; --surface:#FFFFFF; --ink:#17302A; --muted:#5B6F69; --line:#D3DEDA; --soft:#E3EBE8;
  --spruce:#2F6253; --spruce-ink:#FFFFFF; --sound:#336C92; --gold:#B8860B; --rose:#B4483A; --ok:#2F7D4F;
  --c1:#2F6253; --c2:#336C92; --c3:#B8860B; --c4:#8C5A9E; --c5:#C26A3D; --c6:#4F8A8B; --c7:#7A8B3A; --c8:#9A5468; --c9:#6B7A8F;
  --display:ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI Variable Display", system-ui, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto, sans-serif;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1917; --surface:#15231F; --ink:#E3ECE8; --muted:#94A8A1; --line:#2A3D38; --soft:#1C2E29;
    --spruce:#79BBA5; --spruce-ink:#0E1917; --sound:#7DB2D6; --gold:#E0B44A; --rose:#E3806F; --ok:#7CCB98;
    --c1:#79BBA5; --c2:#7DB2D6; --c3:#E0B44A; --c4:#C29AD3; --c5:#E39A6E; --c6:#83C4C5; --c7:#B5C46E; --c8:#D78FA4; --c9:#A3B1C4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1917; --surface:#15231F; --ink:#E3ECE8; --muted:#94A8A1; --line:#2A3D38; --soft:#1C2E29;
  --spruce:#79BBA5; --spruce-ink:#0E1917; --sound:#7DB2D6; --gold:#E0B44A; --rose:#E3806F; --ok:#7CCB98;
  --c1:#79BBA5; --c2:#7DB2D6; --c3:#E0B44A; --c4:#C29AD3; --c5:#E39A6E; --c6:#83C4C5; --c7:#B5C46E; --c8:#D78FA4; --c9:#A3B1C4;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sound);outline-offset:2px}
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 20px 4px}
.brand{font:750 22px/1 var(--display);letter-spacing:-.02em}
.status{font-size:12.5px;color:var(--muted)}
.barright{display:flex;align-items:center;gap:12px}
.lockbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer}
body.locked .top{display:none}
#gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 22px 24px}
#gate[hidden]{display:none}
.gatebox{width:100%;max-width:380px}
.gatebox img{width:64px;height:64px;border-radius:15px;display:block;margin-bottom:22px}
.gatebox h1{font-size:40px;font-weight:750;letter-spacing:-.03em}
.gatebox p{color:var(--muted);margin:8px 0 22px}
.gatebox .box{min-height:50px;margin-bottom:10px}
.gatebox .box input{font-size:17px}
.gatebox .btn{width:100%;padding:13px;font-size:16px;margin-top:4px}
.gatebox .err{color:var(--rose);margin:12px 0 0;font-size:14px;min-height:1em}
.linkbtn{border:0;background:none;color:var(--sound);cursor:pointer;padding:12px 0;font-weight:500;display:block}
.steps{margin:0 0 18px;padding-left:20px;color:var(--ink)}
.steps li{margin:4px 0}
.tabs{max-width:1100px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 10px 12px;white-space:nowrap;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--spruce)}
main{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;margin:0}
h2{font-size:24px;font-weight:650;margin-bottom:4px}
h3{font-size:17px;font-weight:650}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.lede{color:var(--muted);max-width:62ch;margin-bottom:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack>*+*{margin-top:18px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.grid.wide{grid-template-columns:minmax(0,5fr) minmax(0,4fr)}
@media (max-width:820px){.grid.wide{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field .lab{font-size:13px;color:var(--muted);font-weight:500}
.box{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px;min-height:40px}
.box:focus-within{border-color:var(--sound);box-shadow:0 0 0 3px color-mix(in srgb,var(--sound) 20%,transparent)}
.box i{font-style:normal;color:var(--muted);font-size:14px}
.box input,.box select{border:0;background:transparent;outline:0;padding:8px 4px;width:100%;min-width:0}
.box select{cursor:pointer}
.hint{font-size:12.5px;color:var(--muted)}
.btn{border:1px solid var(--spruce);background:var(--spruce);color:var(--spruce-ink);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.danger{background:transparent;color:var(--rose);border-color:color-mix(in srgb,var(--rose) 45%,transparent)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:6px 8px;border-radius:6px}
.x:hover{color:var(--rose);background:var(--soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.big{font:650 30px/1.1 var(--display);letter-spacing:-.02em}
.mid{font:650 21px/1.15 var(--display)}
.good{color:var(--ok)} .bad{color:var(--rose)} .warn{color:var(--gold)}
.note{border-left:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--surface));padding:10px 14px;border-radius:0 9px 9px 0;font-size:14px}
.note.info{border-color:var(--sound);background:color-mix(in srgb,var(--sound) 8%,var(--surface))}
.note.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
/* hero */
.hero{padding:6px 0 4px}
.hero h1{font-size:clamp(34px,6.2vw,64px);line-height:1.02;font-weight:750;letter-spacing:-.035em;max-width:16ch}
.hero .sub{margin-top:12px;font-size:16.5px;color:var(--muted);max-width:60ch}
.track{position:relative;height:118px;margin:28px 6px 6px}
.track .rail{position:absolute;left:0;right:0;top:58px;height:3px;background:var(--line);border-radius:3px}
.track .done{position:absolute;left:0;top:58px;height:3px;background:var(--ink);border-radius:3px;width:0}
.mark{position:absolute;top:50px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.mark .dot{width:19px;height:19px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px currentColor;background:currentColor}
.mark .tag{position:absolute;white-space:nowrap;font-size:13px;line-height:1.25;text-align:center;color:var(--ink)}
.mark .tag b{display:block;font-weight:600}
.mark .tag span{color:var(--muted)}
.mark.up .tag{bottom:28px} .mark.down .tag{top:28px}
.mark.start .dot{width:11px;height:11px;border:0;box-shadow:none;background:var(--ink);margin-top:4px}
.mark.edgeL .tag{left:-6px;text-align:left} .mark.edgeR .tag{right:-6px;text-align:right}
.milelist{display:none}
@media (max-width:640px){.track{display:none}.milelist{display:block}}
.mile{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mile:last-child{border-bottom:0}
.mile .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
/* flow bar */
.flow{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--soft);margin:14px 0 12px}
.flow div{height:100%;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* sliders */
.slide{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:4px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.slide:last-child{border-bottom:0}
.slide label{font-weight:500}
.slide output{text-align:right;font-weight:600}
.slide input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--spruce)}
/* bars */
.bars{display:flex;flex-direction:column;gap:11px}
.brow .spread{font-size:14px}
.meter{height:8px;background:var(--soft);border-radius:5px;overflow:hidden;margin-top:5px;position:relative}
.meter>div{height:100%;border-radius:5px;background:var(--spruce)}
.meter>div.over{background:var(--rose)}
.prog{height:12px;background:var(--soft);border-radius:7px;overflow:hidden}
.prog>div{height:100%;border-radius:7px}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .box{min-height:36px}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}
.scroll{overflow-x:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--soft)}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 15%,transparent)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp>div{border:1px solid var(--line);border-radius:12px;padding:14px}
.cmp>div.pick{border-color:var(--spruce);box-shadow:inset 0 0 0 1px var(--spruce)}
.chart svg{width:100%;height:auto;display:block}
.chart text{font:13px var(--body);fill:var(--muted)}
.donutwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donutwrap svg{width:170px;height:170px;flex:none}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.check b{width:20px;flex:none;text-align:center}
.goal{border-top:1px solid var(--line);padding-top:18px}
.goal:first-child{border-top:0;padding-top:0}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--soft);color:var(--muted);font-weight:500}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.toggle input{accent-color:var(--spruce);width:16px;height:16px}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.flash{margin-bottom:14px}
@media (max-width:560px){main{padding:18px 14px 70px}.panel{padding:16px}.cmp{grid-template-columns:1fr}.big{font-size:26px}}
@media (prefers-reduced-motion:no-preference){.meter>div,.prog>div,.flow div{transition:width .35s ease}}

/* ---------- app shell ---------- */
.box input,.box select{font-size:16px}
.x{min-width:40px;min-height:40px}
body.locked .top,body.locked #tabs,body.locked #bottomnav,body.locked #fab,body.onboarding #tabs,body.onboarding #bottomnav,body.onboarding #fab,body.sheetopen #fab{display:none}
#tabs{display:none}
#bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nb{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.nb svg{width:24px;height:24px}
.nb[aria-current="page"]{color:var(--spruce)}
main{padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
body.onboarding main{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
#fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:7;width:58px;height:58px;border-radius:50%;border:0;background:var(--spruce);color:var(--spruce-ink);box-shadow:0 8px 22px color-mix(in srgb,var(--ink) 30%,transparent);cursor:pointer;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
#fab svg{width:26px;height:26px}
#fab:active{transform:scale(.94)}
.backlink{border:0;background:none;color:var(--sound);font-weight:600;padding:0 0 12px;cursor:pointer;font-size:15px}
.desk{display:none}
.pagehead{margin-bottom:16px;flex-wrap:wrap}
@media (min-width:900px){
  #bottomnav,.backlink{display:none}
  .desk{display:inline-block}
  #tabs{display:flex;flex-direction:column;gap:2px;position:fixed;top:0;bottom:0;left:0;width:224px;padding:calc(70px + env(safe-area-inset-top,0px)) 12px 20px;border-right:1px solid var(--line);background:var(--paper);z-index:4;overflow-y:auto}
  .side button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:500;color:var(--muted);cursor:pointer;text-align:left;font-size:15px}
  .side button svg{width:20px;height:20px;flex:none}
  .side button:hover{color:var(--ink)}
  .side button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .bar{max-width:none;padding:14px 24px 12px}
  main{margin:0 0 0 224px;max-width:1120px;padding:28px 36px 80px}
  body.onboarding main{margin-left:0;max-width:none}
  #fab{bottom:28px;right:28px}
}
.top .bar{padding-bottom:12px}
/* rows */
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--soft)}
.ic svg{width:20px;height:20px}
.ic.sm{width:32px;height:32px;font-size:16px;border-radius:9px}
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;padding:14px 4px 4px}
.day:first-child{padding-top:0}
.txrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:9px 6px;text-align:left;cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:transparent}
.txrow:hover,.txrow:active{background:var(--soft)}
.txmain{flex:1;min-width:0;display:flex;flex-direction:column}
.txmain b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txmain>span{font-size:13px;color:var(--muted)}
.txamt{font-weight:600;white-space:nowrap}
.monthnav{display:flex;align-items:center;justify-content:center;gap:10px}
.monthnav b{min-width:150px;text-align:center;font-weight:600}
.morerow{display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;margin-bottom:10px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,18,15,.42)}
#sheet[hidden]{display:none}
.sheetpanel{background:var(--surface);width:100%;max-width:540px;border-radius:22px 22px 0 0;padding:8px 20px calc(18px + env(safe-area-inset-bottom,0px));max-height:94vh;max-height:94dvh;overflow-y:auto}
@media (prefers-reduced-motion:no-preference){.sheetpanel{animation:sheetup .24s cubic-bezier(.2,.8,.2,1)}}
@keyframes sheetup{from{transform:translateY(60px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
@media (min-width:640px){#sheet{align-items:center}.sheetpanel{border-radius:20px;padding-bottom:22px}.grab{display:none}}
.amt{display:flex;align-items:baseline;justify-content:center;gap:2px;margin:10px 0 18px}
.amt span{font:600 32px var(--display);color:var(--muted)}
.amt input{font:700 52px/1.1 var(--display);border:0;background:transparent;outline:0;color:var(--ink);letter-spacing:-.02em;padding:0;min-width:1.6ch;max-width:8ch}
.amt input::placeholder{color:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:8px 12px;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chip[aria-pressed="true"]{background:var(--spruce);color:var(--spruce-ink);border-color:var(--spruce)}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:25;background:var(--ink);color:var(--paper);border-radius:12px;padding:11px 14px 11px 16px;display:flex;gap:16px;align-items:center;font-size:14.5px;transition:opacity .2s,transform .2s;width:max-content;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:none;color:var(--gold);font-weight:700;cursor:pointer;padding:4px}
@media (min-width:900px){#toast{bottom:32px;left:calc(50% + 112px)}}
/* setup */
.wiz{max-width:580px;margin:0 auto;padding-top:8px}
.wiz h1{font-size:clamp(30px,6vw,42px);font-weight:750;letter-spacing:-.03em;line-height:1.08;margin:8px 0 8px}
.wiz .lede{margin-bottom:18px}
.wizlogo{width:60px;height:60px;border-radius:14px;display:block;margin:20px 0 18px}
.steptag{font-size:13px;color:var(--muted);font-weight:600}
.dots{display:flex;gap:6px;margin:6px 0 14px}
.dots i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--spruce)}
.wiznav{display:flex;gap:10px;margin-top:22px}
.wiznav .btn{flex:1;padding:14px;font-size:16px;white-space:normal}
.preview{margin-top:16px}
</style>
</head>
<body>
<div class="top">
  <div class="bar"><div class="brand">Runway</div><div class="barright"><div id="status" class="status" aria-live="polite">Encrypted on this device</div><button class="lockbtn" data-act="lockNow">Lock</button></div></div>
</div>
<nav id="tabs" class="side" aria-label="Sections"></nav>
<div id="gate" hidden></div>
<main id="view"></main>
<nav id="bottomnav" aria-label="Sections"></nav>
<button id="fab" data-act="openAdd" aria-label="Add a purchase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="csvfile" accept=".csv,text/csv" hidden>
<input type="file" id="backupfile" accept=".json,application/json" hidden>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);

/* ---------- tax assumptions (2026, single filer; editable in Settings) ---------- */
const BRACKETS = [[12400,.10],[50400,.12],[105700,.22],[201775,.24],[256225,.32],[640600,.35],[Infinity,.37]];
function fedTax(taxable){
  let tax = 0, prev = 0, marginal = .10;
  for (const [cap, r] of BRACKETS){ if (taxable > prev){ tax += (Math.min(taxable, cap) - prev) * r; marginal = r; } prev = cap; }
  return {tax, marginal};
}

function blank(){

  s.sample = false; s.tx = []; s.debts = []; s.accounts = [{id: uid(), name: "Checking", balance: 0}, {id: uid(), name: "Savings", balance: 0}, {id: uid(), name: "401(k)", balance: 0}];
  s.budget.forEach(b => b.planned = 0); s.debtExtra = 0; s.snapshots = [];

function migrate(s){
  const base = seed();
  for (const k of Object.keys(base)) if (s[k] === undefined) s[k] = base[k];
  s.settings = Object.assign({}, base.settings, s.settings);
  s.pay = Object.assign({}, base.pay, s.pay);
  s.car = Object.assign({}, base.car, s.car);
  return s;
}

/* ---------- calculations ---------- */
function payCalc(s = state){
  const p = s.pay, st = s.settings;
  const gross = num(p.salary);
  const k401 = gross * num(p.k401) / 100;
  const match = gross * Math.min(num(p.k401), num(p.matchCap)) * num(p.match) / 1e4;
  const pretax = num(p.pretaxMonthly) * 12;
  const taxable = Math.max(0, gross - k401 - pretax - num(st.stdDeduction));
  const {tax: fed, marginal} = fedTax(taxable);
  const ficaWages = Math.max(0, gross - pretax);
  const ss = Math.min(ficaWages, num(st.ssBase)) * 0.062;
  const med = ficaWages * 0.0145 + Math.max(0, ficaWages - 200000) * 0.009;
  const wac = gross * num(st.waCares) / 100;
  const pfml = Math.min(gross, num(st.ssBase)) * num(st.pfml) / 100;
  const net = gross - k401 - pretax - fed - ss - med - wac - pfml;
  const periods = p.freq === "biweekly" ? 26 : 24;
  return {gross, k401, match, pretax, fed, ss, med, wac, pfml, net, periods, perCheck: net / periods, monthly: net / 12, marginal, taxable};
}
const suppRate = (s = state) => num(s.settings.supplemental)/100 + 0.0765 + num(s.settings.waCares)/100 + num(s.settings.pfml)/100;
function bonusGross(s, mk){
  const i = diffMonths(s.pay.startMonth || todayKey(), mk);
  if (i >= 0 && i < 12) return num(s.pay.bonusY1) / 12;
  if (i >= 12 && i < 24) return num(s.pay.bonusY2) / 12;
  return 0;
}
const bonusNet = (s, mk) => bonusGross(s, mk) * (1 - suppRate(s));
const VEST = [[12,5],[18,7.5],[24,7.5],[30,20],[36,20],[42,20],[48,20]];
function vests(s = state){
  return VEST.map(([m, p]) => {
    const mk = addMonths(s.pay.startMonth || todayKey(), m);
    const shares = num(s.pay.rsuShares) * p / 100, value = shares * num(s.pay.stockPrice);
    return {mk, pct: p, shares, value, net: value * (1 - suppRate(s)), past: diffMonths(mk, todayKey()) > 0};
  });
}
function carCalc(s = state){
  const c = s.car, price = num(c.price);
  const down = price * num(c.downPct) / 100, tax = price * num(c.salesTax) / 100, fees = num(c.fees);
  const upfront = down + tax + fees, loan = Math.max(0, price - down), r = num(c.apr) / 1200, n = Math.max(1, num(c.term));
  const payment = loan <= 0 ? 0 : r === 0 ? loan / n : loan * r / (1 - Math.pow(1 + r, -n));
  const interest = payment * n - loan;
  const running = num(c.insurance) + num(c.gas) + num(c.parking) + num(c.maint) + num(c.regAnnual) / 12;
  return {price, down, tax, fees, upfront, loan, payment, interest, running, monthly: payment + running, full: price + tax + fees};
}
const plannedNeeds = (s = state) => sum(s.budget.filter(b => b.group === "needs"), b => num(b.planned));
const plannedWants = (s = state) => sum(s.budget.filter(b => b.group === "wants"), b => num(b.planned));
const debtMins = (s = state) => sum(s.debts.filter(d => num(d.balance) > 0), d => num(d.min));
const debtTotal = (s = state) => sum(s.debts, d => num(d.balance));
function goalTarget(s, g){
  if (g.auto) return Math.round(num(g.months) * (plannedNeeds(s) + debtMins(s)));
  if (g.linkCar) return Math.round(carCalc(s).upfront);
  return num(g.target);
}
function payOrder(list, strategy){
  return list.slice().sort(strategy === "avalanche" ? (a,b) => b.apr - a.apr || a.bal - b.bal : (a,b) => a.bal - b.bal || b.apr - a.apr);
}
function stepDebts(ds, pool, strategy){
  let interest = 0, left = pool;
  for (const d of ds) if (d.bal > 0){ const i = d.bal * d.apr / 1200; d.bal += i; interest += i; }
  for (const d of ds) if (d.bal > 0){ const p = Math.min(d.bal, d.min, left); d.bal -= p; left -= p; }
  for (const d of payOrder(ds.filter(d => d.bal > 0.005), strategy)){ if (left <= 0) break; const p = Math.min(d.bal, left); d.bal -= p; left -= p; }
  for (const d of ds) if (d.bal < 0.005) d.bal = 0;
  return {interest, left};
}
const debtCopy = s => s.debts.filter(d => num(d.balance) > 0).map(d => ({id: d.id, name: d.name, bal: num(d.balance), apr: num(d.apr), min: num(d.min)}));
function simulateDebts(s, strategy, extra, max = 600){
  const ds = debtCopy(s), pool = sum(ds, d => d.min) + extra, payoff = {};
  const series = [sum(ds, d => d.bal)]; let interest = 0, m = 0;
  while (ds.some(d => d.bal > 0) && m < max){
    m++; interest += stepDebts(ds, pool, strategy).interest;
    for (const d of ds) if (d.bal === 0 && payoff[d.id] == null) payoff[d.id] = m;
    series.push(sum(ds, d => d.bal));
  }
  return {months: m, interest, series, payoff, never: ds.some(d => d.bal > 0)};
}
function project(s = state, maxM = 120){
  const ds = debtCopy(s), mins = sum(ds, d => d.min), hadDebt = ds.length > 0;
  let debtFree = hadDebt ? null : 0;
  const goals = s.goals.map(g => ({id: g.id, saved: num(g.saved), target: goalTarget(s, g), monthly: num(g.monthly)}));
  const done = {};
  goals.forEach(g => { if (g.target > 0 && g.saved >= g.target) done[g.id] = 0; });
  const start = todayKey(), extraBase = num(s.debtExtra);
  for (let m = 1; m <= maxM; m++){
    const mk = addMonths(start, m - 1), bonus = bonusNet(s, mk), add = {};
    const put = (id, amt) => { if (id && amt > 0) add[id] = (add[id] || 0) + amt; };
    if (ds.some(d => d.bal > 0)){
      const r = stepDebts(ds, mins + extraBase + (s.bonusTo === "debt" ? bonus : 0), s.strategy);
      put(s.rolloverTo, r.left);
      if (!ds.some(d => d.bal > 0)) debtFree = m;
    } else {
      if (hadDebt) put(s.rolloverTo, mins + extraBase);
      if (s.bonusTo === "debt") put(s.rolloverTo, bonus);
    }
    if (s.bonusTo && s.bonusTo !== "debt") put(s.bonusTo, bonus);
    for (const g of goals){
      g.saved += g.monthly + (add[g.id] || 0);
      if (done[g.id] == null && g.target > 0 && g.saved >= g.target) done[g.id] = m;
    }
    if (debtFree != null && goals.every(g => done[g.id] != null || g.target <= 0)) break;
  }
  return {debtFree, done};
}

/* ---------- charts ---------- */
function lineChart(series, labels, opts = {}){
  const W = 520, H = opts.h || 230, pl = 50, pr = 14, pt = 14, pb = 30;
  const all = series.flatMap(s => s.values), max = Math.max(1, ...all), min = Math.min(0, ...all);
  const n = Math.max(2, ...series.map(s => s.values.length));
  const x = i => pl + i * (W - pl - pr) / (n - 1), y = v => pt + (H - pt - pb) * (1 - (v - min) / ((max - min) || 1));
  let g = "";
  for (let k = 0; k <= 4; k++){ const v = min + (max - min) * k / 4, yy = y(v);
    g += `<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" style="stroke:var(--line)" stroke-width="1"/><text x="${pl-8}" y="${yy+4}" text-anchor="end">${short(v)}</text>`; }
  const step = Math.max(1, Math.ceil((n - 1) / 5));
  for (let i = 0; i < n; i += step) if (labels[i]) g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(labels[i])}</text>`;
  for (const s of series){
    const d = s.values.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
    g += `<path d="${d}" fill="none" style="stroke:${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="6 5"' : ""}/>`;
    if (s.values.length === 1) g += `<circle cx="${x(0)}" cy="${y(s.values[0])}" r="4" style="fill:${s.color}"/>`;
  }
  const leg = series.length > 1 ? `<div class="legend" style="margin-top:8px">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Line chart")}">${g}</svg>${leg}</div>`;
}
function donut(items, centerTop, centerBottom){
  const total = sum(items, i => i.value), R = 70, C = 2 * Math.PI * R;
  let off = 0, arcs = "";
  if (total > 0) for (const it of items){ const len = it.value / total * C;
    arcs += `<circle r="${R}" cx="85" cy="85" fill="none" style="stroke:${it.color}" stroke-width="22" stroke-dasharray="${Math.max(0, len - 1.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 85 85)"/>`; off += len; }
  else arcs = `<circle r="${R}" cx="85" cy="85" fill="none" style="stroke:var(--soft)" stroke-width="22"/>`;
  return `<svg viewBox="0 0 170 170" role="img" aria-label="Spending by category">${arcs}
    <text x="85" y="82" text-anchor="middle" style="font:650 19px var(--display);fill:var(--ink)">${esc(centerTop)}</text>
    <text x="85" y="102" text-anchor="middle" style="font:12px var(--body);fill:var(--muted)">${esc(centerBottom)}</text></svg>`;
}

function getObj(path){

  const parts = path.split("."); let o = state; for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]]; return [o, parts[parts.length - 1]];
}
function setVal(path, raw, t){

  o[f] = t === "n" ? num(raw) : t === "b" ? !!raw : raw;

const CAT_ICONS = [["insur", "🛡️"], ["rent|mortgage|housing", "🏠"], ["util|electric|power|water", "💡"], ["internet|wifi", "🌐"], ["phone|mobile", "📱"], ["grocer", "🛒"], ["transit|orca|bus|uber|lyft|transport", "🚌"], ["personal|hair|beauty", "🧴"], ["health|medical|doctor|pharm|dental", "💊"], ["dining|restaurant|food|eat|takeout", "🍜"], ["coffee|cafe", "☕"], ["subscr|stream|netflix|spotify", "📺"], ["gym|fitness|climb|sport", "🏋️"], ["entertain|movie|fun|game|concert", "🎟️"], ["shop|cloth", "🛍️"], ["travel|flight|trip|hotel|vacation", "✈️"], ["gift|donat|charity", "🎁"], ["pet|dog|cat", "🐾"], ["car|gas|parking|auto", "🚗"], ["edu|book|class|course|school", "📚"], ["home|furniture|decor", "🛋️"], ["family|parent", "👪"]];
const catIcon = name => { const n = String(name || "").toLowerCase(); for (const [re, ic] of CAT_ICONS) if (new RegExp(re).test(n)) return ic; return "🏷️"; };
const yesterdayISO = () => { const d = new Date(); d.setDate(d.getDate() - 1); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const dayLabel = d => d === todayISO() ? "Today" : d === yesterdayISO() ? "Yesterday" : new Date(d + "T12:00:00").toLocaleDateString("en-US", {weekday: "short", month: "short", day: "numeric"});
const GOALCOL = id => id === "emergency" ? "var(--sound)" : id === "car" ? "var(--gold)" : `var(--c${4 + (state.goals.findIndex(g => g.id === id) % 4)})`;

/* ---------- overview ---------- */
function overviewOut(){
  const s = state, pr = project(s), start = todayKey(), car = s.goals.find(g => g.id === "car");
  const ml = m => monthLabel(addMonths(start, m - 1));
  const pc = payCalc(s), planned = plannedNeeds(s) + plannedWants(s), spent = sum(spentIn(s, start), t => num(t.amount));
  const leftToSpend = planned - spent, monthName = new Date(Number(start.slice(0, 4)), Number(start.slice(5)) - 1, 1).toLocaleString("en-US", {month: "long"});
  const saving = sum(s.goals, g => num(g.monthly)) + (s.debts.some(d => num(d.balance) > 0) ? num(s.debtExtra) : 0) + pc.k401 / 12;
  let head;
  if (!pc.gross && !planned) head = "Add your pay and budget to see your month.";
  else if (leftToSpend >= 0) head = `${$$(leftToSpend)} left to spend in ${monthName}.`;
  else head = `${$$(-leftToSpend)} over budget in ${monthName}.`;
  const sub = [];
  if (pc.gross) sub.push(`You're saving ${pct((pc.monthly + pc.k401 / 12) ? saving / (pc.monthly + pc.k401 / 12) : 0)} of your take home, counting your 401(k)`);
  if (s.debts.some(d => num(d.balance) > 0)) sub.push(pr.debtFree != null ? `debt free by ${ml(pr.debtFree)}` : "debt free date is more than 10 years out at this pace");
  sub.push(`net worth ${$$(sum(s.accounts, a => num(a.balance)) - debtTotal(s))}`);
  const subText = sub.join(", ").replace(/^./, c => c.toUpperCase()) + ".";

  const miles = [];
  if (s.debts.some(d => num(d.balance) > 0)) miles.push({name: "Debt free", m: pr.debtFree, color: "var(--rose)"});
  for (const g of s.goals) if (goalTarget(s, g) > 0) miles.push({name: g.id === "emergency" ? "Emergency fund full" : g.id === "car" ? "Car fund ready" : g.name, m: pr.done[g.id], color: GOALCOL(g.id)});
  const shown = miles.filter(x => x.m != null && x.m > 0).sort((a, b) => a.m - b.m);
  const span = Math.max(6, ...shown.map(x => x.m));
  let track = `<div class="track" aria-hidden="true"><div class="rail"></div><div class="mark start up edgeL" style="left:0%"><div class="dot"></div><div class="tag"><b>Today</b><span>${monthLabel(start)}</span></div></div>`;
  shown.forEach((x, i) => {
    const left = clamp(x.m / span * 100, 4, 100);
    const edge = left > 82 ? " edgeR" : "";
    track += `<div class="mark ${i % 2 ? "up" : "down"}${edge}" style="left:${left}%;color:${x.color}"><div class="dot"></div><div class="tag"><b>${esc(x.name)}</b><span>${ml(x.m)}</span></div></div>`;
  });
  track += `</div>`;
  const list = `<div class="milelist panel" style="margin-top:18px">${miles.length ? miles.slice().sort((a, b) => (a.m ?? 1e9) - (b.m ?? 1e9)).map(x => `<div class="mile"><span><i class="sw" style="background:${x.color}"></i>${esc(x.name)}</span><span class="muted">${x.m == null ? "Over 10 years" : x.m === 0 ? "Done" : ml(x.m) + ", " + inMonths(x.m)}</span></div>`).join("") : `<p class="muted">Add a debt or a savings goal to see milestones.</p>`}</div>`;
  const doneChips = miles.filter(x => x.m === 0).map(x => `<span class="pill">${esc(x.name)}: done</span>`).join(" ");
  const never = miles.filter(x => x.m == null).map(x => `<span class="pill">${esc(x.name)}: over 10 years at this pace</span>`).join(" ");
  return `<section class="hero"><h1>${esc(head)}</h1>${subText ? `<p class="sub">${esc(subText)}</p>` : ""}</section>${track}${list}${doneChips || never ? `<div class="row" style="margin-top:6px">${doneChips} ${never}</div>` : ""}`;
}
function flowHTML(){
  const s = state, pc = payCalc(s), spend = plannedNeeds(s) + plannedWants(s), mins = debtMins(s);
  const saving = sum(s.goals, g => num(g.monthly)) + (s.debts.some(d => num(d.balance) > 0) ? num(s.debtExtra) : 0);
  const left = pc.monthly - spend - mins - saving, base = Math.max(pc.monthly, spend + mins + saving, 1);
  const parts = [["Living costs", spend, "var(--sound)"], ["Debt minimums", mins, "var(--rose)"], ["Savings and extra debt", saving, "var(--spruce)"], ["Not yet assigned", Math.max(0, left), "var(--line)"]];
  const bm = bonusNet(s, todayKey());
  return `<div class="spread"><div><div class="muted small">Monthly take home</div><div class="big">${$$(pc.monthly)}</div></div>
    <div style="text-align:right"><div class="muted small">${left >= 0 ? "Not yet assigned" : "Over by"}</div><div class="mid ${left < 0 ? "bad" : ""}">${$$(Math.abs(left))}</div></div></div>

    ${bm > 0 ? `<p class="hint" style="margin-top:6px">Plus about ${$$(bm)} this month from your sign on bonus, going to ${s.bonusTo === "debt" ? "debt" : esc((s.goals.find(g => g.id === s.bonusTo) || {name: "nothing yet"}).name)}.</p>` : ""}`;
}

/* ---------- budget ---------- */

      ${field("401(k) contribution", "pay.k401", p.k401, {suf: "%", hint: "At least enough to get your full employer match"})}

    ${total ? `<p class="note ${left >= 0 ? "ok" : ""} preview">That's <b>${$$(total)}</b> a month${pc.gross ? `, leaving about <b>${$$(left)}</b> for debt and saving` : ""}.</p>` : ""}

      <div class="fields">${field("Saved so far", "goals#emergency.saved", em.saved, {pre: "$", blankZero: true, ph: "0"})}${field("Add each month", "goals#emergency.monthly", em.monthly, {pre: "$", blankZero: true, ph: "0"})}</div>
      <p class="hint" style="margin-top:8px">Target: ${$$(goalTarget(s, em))}</p></div>` : ""}
    ${car ? `<div class="panel"><h3>🚗 Car</h3><p class="hint" style="margin:4px 0 12px">You'll save the down payment, tax, and fees. Fine tune the details in Car planner.</p>

      <p class="hint" style="margin-top:8px">Cash needed upfront: ${$$(cc.upfront)}</p></div>` : ""}
    ${carHint}
    ${nav("Finish")}</div>`;

/* ---------- add / edit sheet ---------- */
let sheetTx = null, sheetManual = false;
function openSheet(id){
  const t = id ? state.tx.find(x => x.id === id) : null;
  sheetTx = t ? {...t} : {id: null, date: todayISO(), desc: "", amount: "", cat: ""};
  sheetManual = !!(t && t.cat);
  const el = $("#sheet");
  el.innerHTML = `<div class="sheetpanel" role="dialog" aria-modal="true" aria-label="${t ? "Edit purchase" : "Add purchase"}"><div class="grab"></div>
    <div class="spread"><h3>${t ? "Edit purchase" : "Add purchase"}</h3><button class="x" data-sheet="close" aria-label="Close">×</button></div>
    <div class="amt"><span>$</span><input id="sh-amt" inputmode="decimal" placeholder="0" value="${t ? esc(t.amount) : ""}" aria-label="Amount" autocomplete="off"></div>
    <label class="field"><span class="lab">What was it</span><span class="box"><input id="sh-desc" value="${esc(sheetTx.desc)}" placeholder="Trader Joe's" autocomplete="off" enterkeyhint="done"></span></label>
    <div class="lab small muted" style="margin-top:16px;font-weight:500">Category</div>
    <div class="chips">${state.budget.map(b => `<button class="chip" data-chip="${b.id}" aria-pressed="${sheetTx.cat === b.id}">${catIcon(b.name)} ${esc(b.name)}</button>`).join("")}</div>
    <label class="field"><span class="lab">Date</span><span class="box"><input id="sh-date" type="date" value="${sheetTx.date}"></span></label>
    <p class="err small bad" id="sh-err" style="margin-top:8px;min-height:1em"></p>
    <div class="row" style="margin-top:6px">${t ? `<button class="btn danger" data-sheet="delete">Delete</button>` : ""}<button class="btn" style="flex:1;padding:14px;font-size:16px" data-sheet="save">${t ? "Save changes" : "Add purchase"}</button></div>
  </div>`;
  el.hidden = false; document.body.classList.add("sheetopen");
  sizeAmt(); $("#sh-amt").focus();
}
function closeSheet(){ const el = $("#sheet"); el.hidden = true; el.innerHTML = ""; sheetTx = null; document.body.classList.remove("sheetopen"); }
function sizeAmt(){ const a = $("#sh-amt"); if (a) a.style.width = Math.max(1.6, (a.value || "0").length + 0.6) + "ch"; }
function pickChip(id){ sheetTx.cat = id; document.querySelectorAll("#sheet .chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.chip === id)); }
function saveSheet(){
  const amt = Math.round(num($("#sh-amt").value) * 100) / 100, desc = $("#sh-desc").value.trim(), date = $("#sh-date").value || todayISO();
  if (!(amt > 0)){ $("#sh-err").textContent = "Enter an amount."; $("#sh-amt").focus(); return; }
  const snap = JSON.stringify(state), isNew = !sheetTx.id, cat = sheetTx.cat;
  const finalDesc = desc || (cat ? catName(cat) : "Purchase");
  if (isNew) state.tx.push({id: uid(), date, desc: finalDesc, amount: amt, cat});
  else { const t = state.tx.find(x => x.id === sheetTx.id); if (t) Object.assign(t, {date, desc: finalDesc, amount: amt, cat}); }
  if (desc && cat) state.descCats[normDesc(desc)] = cat;
  closeSheet(); ui.month = date.slice(0, 7); changed(false); render();
  toast(isNew ? `Added ${$$(amt, true)} for ${finalDesc}` : "Purchase updated", () => { state = migrate(JSON.parse(snap)); changed(); });
}
$("#sheet").addEventListener("click", e => {
  if (e.target.id === "sheet") return closeSheet();
  const c = e.target.closest("[data-chip]"); if (c){ sheetManual = true; pickChip(c.dataset.chip); return; }
  const b = e.target.closest("[data-sheet]"); if (!b) return;
  if (b.dataset.sheet === "close") closeSheet();
  else if (b.dataset.sheet === "save") saveSheet();
  else if (b.dataset.sheet === "delete"){ const id = sheetTx.id; closeSheet(); withUndo("Purchase deleted", () => { state.tx = state.tx.filter(t => t.id !== id); }); }
});
$("#sheet").addEventListener("input", e => {
  if (e.target.id === "sh-amt"){ sizeAmt(); $("#sh-err").textContent = ""; }
  if (e.target.id === "sh-desc" && !sheetManual){ const g = state.descCats[normDesc(e.target.value)]; if (g) pickChip(g); }
});
$("#sheet").addEventListener("keydown", e => { if (e.key === "Enter" && (e.target.id === "sh-amt" || e.target.id === "sh-desc")){ e.preventDefault(); saveSheet(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

/* ---------- toast and undo ---------- */
let toastTimer = null;
function toast(text, undo){
  const el = $("#toast");
  el.innerHTML = `<span>${esc(text)}</span>${undo ? `<button type="button">Undo</button>` : ""}`;
  if (undo) el.querySelector("button").onclick = () => { el.classList.remove("show"); undo(); };
  el.classList.add("show"); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), undo ? 5500 : 3000);
}
function withUndo(label, fn){
  const snap = JSON.stringify(state); fn(); changed();
  toast(label, () => { state = migrate(JSON.parse(snap)); changed(); });
}

/* ---------- debt ---------- */

function renderDebt(){
  const s = state, extra = num(s.debtExtra), start = todayKey();
  const av = simulateDebts(s, "avalanche", extra), sn = simulateDebts(s, "snowball", extra), mn = simulateDebts(s, s.strategy, 0);
  const chosen = s.strategy === "avalanche" ? av : sn, other = s.strategy === "avalanche" ? sn : av;
  const has = s.debts.some(d => num(d.balance) > 0);
  const lenMax = Math.min(Math.max(av.series.length, sn.series.length, mn.series.length), 241);
  const padTo = arr => { const a = arr.slice(0, lenMax); while (a.length < lenMax) a.push(0); return a; };
  const labels = Array.from({length: lenMax}, (_, i) => monthLabel(addMonths(start, i)));
  const under = s.debts.filter(d => num(d.balance) > 0 && num(d.min) <= num(d.balance) * num(d.apr) / 1200);
  const card = (name, r, key) => `<div class="${s.strategy === key ? "pick" : ""}"><div class="spread"><b>${name}</b>${s.strategy === key ? `<span class="pill">Your plan</span>` : `<button class="btn ghost" data-set="strategy" data-val="${key}">Use this</button>`}</div>
    <div class="mid" style="margin-top:8px">${r.never ? "Never at this pace" : monthLabel(addMonths(start, r.months - 1))}</div>
    <div class="muted small">${r.never ? "" : r.months + " months, "}${$$(r.interest)} interest</div></div>`;
  return `<h2>Debt</h2><p class="lede">List every balance, then choose how to attack it. Avalanche pays the highest rate first and saves the most interest. Snowball clears the smallest balance first for quicker wins.</p>
  <div class="panel" style="margin-bottom:18px">
    <div class="scroll"><table class="tbl"><thead><tr><th>Name</th><th>Balance</th><th>Interest rate</th><th>Minimum per month</th><th>Paid off</th><th></th></tr></thead><tbody>
    ${s.debts.map(d => `<tr><td style="min-width:150px">${field("", `debts#${d.id}.name`, d.name, {t: "s", aria: "Debt name"})}</td>
      <td style="min-width:120px">${field("", `debts#${d.id}.balance`, d.balance, {pre: "$", aria: d.name + " balance"})}</td>
      <td style="min-width:100px">${field("", `debts#${d.id}.apr`, d.apr, {suf: "%", aria: d.name + " rate"})}</td>
      <td style="min-width:110px">${field("", `debts#${d.id}.min`, d.min, {pre: "$", aria: d.name + " minimum"})}</td>
      <td class="muted" style="white-space:nowrap">${num(d.balance) <= 0 ? "Done" : chosen.payoff[d.id] ? monthLabel(addMonths(start, chosen.payoff[d.id] - 1)) : "Over 50 years"}</td>
      <td style="width:36px"><button class="x" aria-label="Remove ${esc(d.name)}" data-act="delDebt" data-id="${d.id}">×</button></td></tr>`).join("")}
    </tbody>${s.debts.length ? `<tfoot><tr><td>Total</td><td class="num" style="text-align:left;padding-left:18px">${$$(debtTotal(s))}</td><td></td><td style="padding-left:18px">${$$(debtMins(s))}</td><td colspan="2"></td></tr></tfoot>` : ""}</table></div>
    ${s.debts.length ? "" : `<div class="empty">No debts listed. Add one to see a payoff plan.</div>`}
    <button class="btn ghost" style="margin-top:12px" data-act="addDebt">Add debt</button>
    ${under.map(d => `<p class="note" style="margin-top:12px">${esc(d.name)}: the minimum barely covers interest, so the balance won't shrink on its own. Put extra here first.</p>`).join("")}
  </div>
  ${has ? `<div class="grid wide">
    <div class="panel stack">
      <div class="fields">${field("Extra per month on top of minimums", "debtExtra", s.debtExtra, {pre: "$", hint: "Same as the debt slider on Overview"})}</div>
      <div class="cmp">${card("Avalanche", av, "avalanche")}${card("Snowball", sn, "snowball")}</div>
      ${!chosen.never && !other.never && Math.abs(other.interest - chosen.interest) > 1 ? `<p class="hint">${s.strategy === "avalanche" ? "Avalanche saves" : "Snowball costs"} ${$$(Math.abs(other.interest - chosen.interest))} in interest compared with ${s.strategy === "avalanche" ? "snowball" : "avalanche"}.</p>` : ""}
      ${extra > 0 && !mn.never && !chosen.never ? `<p class="note ok">Your extra ${$$(extra)} a month gets you out ${mn.months - chosen.months} months sooner and saves ${$$(mn.interest - chosen.interest)} versus paying minimums only.</p>` : ""}
      <div><h3 style="margin-bottom:8px">Payoff order</h3>${payOrder(debtCopy(s), s.strategy).map((d, i) => `<div class="mile"><span>${i + 1}. ${esc(d.name)} <span class="muted small">${d.apr}%</span></span><span class="muted">${chosen.payoff[d.id] ? monthLabel(addMonths(start, chosen.payoff[d.id] - 1)) : "Over 50 years"}</span></div>`).join("")}</div>
    </div>
    <div class="panel"><h3 style="margin-bottom:10px">Balance over time</h3>
      ${lineChart([{name: "Avalanche", values: padTo(av.series), color: "var(--spruce)"}, {name: "Snowball", values: padTo(sn.series), color: "var(--gold)", dash: true}, {name: "Minimums only", values: padTo(mn.series), color: "var(--rose)", dash: true}], labels, {label: "Debt balance over time"})}
    </div>
  </div>` : ""}`;
}

/* ---------- goals ---------- */
function renderGoals(){

        ${field("Add each month", `goals#${g.id}.monthly`, g.monthly, {pre: "$"})}

/* ---------- render ---------- */
const RENDER = {overview: renderOverview, paycheck: renderPaycheck, budget: renderBudget, spending: renderSpending, debt: renderDebt, goals: renderGoals, car: renderCar, networth: renderNetWorth, settings: renderSettings, more: renderMore};
function applyTheme(){ const t = state.settings.theme; if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
function render(keepFocus){
  if (!state) return;
  let key = null, sel = null, raw = null;
  const a = document.activeElement;
  if (keepFocus && a && a.dataset && a.dataset.k){ key = a.dataset.k; raw = a.value; try { sel = [a.selectionStart, a.selectionEnd]; } catch(e){} }
  applyTheme(); renderTabs();
  document.body.classList.toggle("onboarding", ui.setup != null);
  $("#view").innerHTML = ui.setup != null ? renderSetup() : (MORE_TABS.includes(ui.tab) ? `<button class="backlink" data-tab="more">‹ More</button>` : "") + RENDER[ui.tab]();
  if (key){ const el = document.querySelector(`[data-k="${CSS.escape(key)}"]`); if (el){ if (el.tagName === "INPUT" && el.type !== "range" && el.type !== "checkbox" && raw != null) el.value = raw; el.focus({preventScroll: true}); if (sel && sel[0] != null) try { el.setSelectionRange(sel[0], sel[1]); } catch(e){} } }
}
function changed(rerender = true){ state.sample = state.sample && true; persist(); if (rerender) render(true); }

/* ---------- events ---------- */
document.addEventListener("input", e => {
  const el = e.target; if (!state || !el.dataset || !el.dataset.k) return;
  const t = el.dataset.t || "s";
  setVal(el.dataset.k, t === "b" ? el.checked : el.value, t);
  if (el.dataset.k.startsWith("tx#") && el.dataset.k.endsWith(".cat")){ const tx = state.tx.find(x => x.id === el.dataset.k.slice(3, -4)); if (tx) state.descCats[normDesc(tx.desc)] = tx.cat; }
  if (el.type === "range"){ const o = document.querySelector(`[data-out="${CSS.escape(el.dataset.k)}"]`); if (o) o.textContent = $$(num(el.value)); persist(); refreshOverviewParts(); return; }
  persist(); render(true);
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.enter){ e.preventDefault(); act(e.target.dataset.enter, e.target); }
});
document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]");
  if (tb){ if (ui.setup != null) return; ui.tab = tb.dataset.tab; ui.flash = null; render(); window.scrollTo({top: 0}); return; }
  const ed = e.target.closest("[data-edit]");
  if (ed){ openSheet(ed.dataset.edit); return; }
  const st = e.target.closest("[data-set]");
  if (st){ state[st.dataset.set] = st.dataset.val; changed(); return; }
  const b = e.target.closest("[data-act]");
  if (b && b.tagName === "BUTTON") act(b.dataset.act, b);
});
function act(name, el){
  const id = el.dataset.id, s = state;
  switch (name){
    case "openAdd": openSheet(null); break;
    case "startSetup": state = blank(); ui.setup = 1; ui.setupMin = 1; changed(); window.scrollTo({top: 0}); break;
    case "rerunSetup": ui.setup = 1; ui.setupMin = 1; render(); window.scrollTo({top: 0}); break;
    case "setupNext": if (ui.setup >= 4){ ui.setup = null; state.sample = false; ui.tab = "overview"; changed(); toast("You're all set. Tap + any time to log a purchase."); } else { ui.setup++; render(); } window.scrollTo({top: 0}); break;
    case "setupBack": if (ui.setup <= (ui.setupMin || 0)){ ui.setup = null; ui.tab = "overview"; } else ui.setup--; render(); window.scrollTo({top: 0}); break;
    case "setupSample": state = seed(); state.updatedAt = Date.now(); ui.setup = null; ui.tab = "overview"; changed(); break;
    case "fillTypical": s.budget.forEach(b => { if (!num(b.planned) && TYPICAL[b.name]) b.planned = TYPICAL[b.name]; }); changed(); break;
    case "addDebtNamed": s.debts.push({id: uid(), name: el.dataset.name, balance: 0, apr: 0, min: 0}); changed(); break;
    case "setEmMonths": { const g = s.goals.find(x => x.id === "emergency"); if (g){ g.months = Number(el.dataset.val); g.auto = true; changed(); } break; }
    case "useCarMonthly": { const g = s.goals.find(x => x.id === "car"); if (g){ g.monthly = Number(el.dataset.val); changed(); } break; }
    case "addCat": s.budget.push({id: uid(), name: "New category", group: el.dataset.group, planned: 0}); changed(); break;
    case "delCat": withUndo(`Removed ${catName(id)}`, () => { state.budget = state.budget.filter(b => b.id !== id); state.tx.forEach(t => { if (t.cat === id) t.cat = ""; }); }); break;
    case "addTx": {
      const date = $("#nt-date").value, desc = $("#nt-desc").value.trim(), amt = num($("#nt-amt").value), cat = $("#nt-cat").value;
      if (!date || !amt){ ui.flash = {kind: "", text: "Add a date and an amount first."}; render(); $("#nt-amt").focus(); return; }
      s.tx.push({id: uid(), date, desc: desc || catName(cat), amount: amt, cat});
      if (desc) s.descCats[normDesc(desc)] = cat;
      ui.month = date.slice(0, 7); ui.flash = {kind: "ok", text: `Added ${$$(amt, true)}${desc ? " at " + desc : ""}.`};
      changed(false); render(); $("#nt-desc").focus(); break;
    }
    case "delTx": withUndo("Purchase deleted", () => { state.tx = state.tx.filter(t => t.id !== id); }); break;
    case "prevMonth": ui.month = addMonths(ui.month, -1); ui.flash = null; render(); break;
    case "nextMonth": ui.month = addMonths(ui.month, 1); ui.flash = null; render(); break;
    case "importCSV": $("#csvfile").value = ""; $("#csvfile").click(); break;
    case "addDebt": s.debts.push({id: uid(), name: "New debt", balance: 0, apr: 0, min: 0}); changed(); break;
    case "delDebt": withUndo("Debt removed", () => { state.debts = state.debts.filter(d => d.id !== id); }); break;
    case "addGoal": { const g = {id: uid(), name: "New goal", target: 1000, saved: 0, monthly: 0, targetDate: ""}; s.goals.push(g); changed(); break; }
    case "delGoal": withUndo("Goal removed", () => { state.goals = state.goals.filter(g => g.id !== id); if (state.bonusTo === id) state.bonusTo = ""; if (state.rolloverTo === id) state.rolloverTo = ""; }); break;
    case "deposit": { const inp = $("#dep-" + id), v = num(inp && inp.value), g = s.goals.find(x => x.id === id); if (g && v){ g.saved = num(g.saved) + v; changed(); toast(`Added ${$$(v)} to ${g.name}`); } break; }
    case "linkCar": { const g = s.goals.find(x => x.id === "car"); if (g){ g.linkCar = true; changed(); } break; }
    case "addAcct": s.accounts.push({id: uid(), name: "New account", balance: 0}); changed(); break;
    case "delAcct": withUndo("Account removed", () => { state.accounts = state.accounts.filter(a => a.id !== id); }); break;
    case "snapshot": { const mk = todayKey(); s.snapshots = s.snapshots.filter(x => x.month !== mk); s.snapshots.push({month: mk, assets: sum(s.accounts, a => num(a.balance)), liabilities: debtTotal(s)}); changed(); toast(`Saved ${monthLabel(mk)} snapshot`); break; }
    case "delSnap": withUndo("Snapshot deleted", () => { state.snapshots = state.snapshots.filter(x => x.month !== id); }); break;
    case "export": exportBackup(); break;
    case "importBackup": ui.backupPass = ($("#bk-pass") || {}).value || ""; if (!ui.backupPass){ ui.flash = {kind: "", text: "Enter the backup's passcode first."}; render(); return; } $("#backupfile").value = ""; $("#backupfile").click(); break;
    case "lockNow": lockApp(); break;
    case "install": if (deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.finally(() => { deferredPrompt = null; render(); }); } break;
    case "changePass": changePass(); break;
    case "wipeDevice": if (confirm("Delete all Runway data and your passcode from this device? Save a backup first if you want to keep anything.")){ session = null; state = null; localStorage.removeItem(VAULT); localStorage.removeItem(FAILS); showGate("setup"); } break;
    case "resetSample": if (confirm("Replace everything with sample numbers?")){ state = seed(); state.updatedAt = Date.now(); changed(); } break;
    case "eraseAll": if (confirm("Clear all your numbers? Your passcode stays the same. Save a backup first if you might want them.")){ state = blank(); changed(); } break;
  }
}

/* ---------- CSV import ---------- */
function parseCSV(text){
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(f); f = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function toISO(v){
  v = String(v || "").trim();
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if (m){ const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${pad(m[1])}-${pad(m[2])}`; }
  const d = new Date(v); return isNaN(d) ? null : `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function importCSV(text){
  const rows = parseCSV(text); if (rows.length < 2) return {kind: "", text: "That file has no rows to import."};
  const head = rows[0].map(h => h.toLowerCase().trim());
  const fi = (...k) => head.findIndex(h => k.some(x => h.includes(x)));
  const di = fi("date"), ai = fi("amount"), de = fi("debit", "withdrawal"), ci = fi("credit", "deposit"), xi = fi("description", "desc", "payee", "merchant", "name", "memo", "details");
  if (di < 0 || (ai < 0 && de < 0)) return {kind: "", text: "Couldn't find date and amount columns. The file needs headers like Date, Description, Amount."};
  const body = rows.slice(1);
  let negSpend = false;
  if (ai >= 0){ const vals = body.map(r => num(r[ai])).filter(v => v); negSpend = vals.filter(v => v < 0).length >= vals.filter(v => v > 0).length; }
  const seen = new Set(state.tx.map(t => t.date + "|" + num(t.amount).toFixed(2) + "|" + normDesc(t.desc)));
  let added = 0, skipped = 0, dup = 0, last = null;
  for (const r of body){
    const date = toISO(r[di]); if (!date){ skipped++; continue; }
    let amt;
    if (ai >= 0){ const v = num(r[ai]); amt = negSpend ? -v : v; }
    else amt = num(r[de]) ? Math.abs(num(r[de])) : -Math.abs(num(r[ci]));
    if (!(amt > 0)){ skipped++; continue; }
    const desc = (xi >= 0 ? r[xi] : "").trim() || "Imported";
    const key = date + "|" + amt.toFixed(2) + "|" + normDesc(desc);
    if (seen.has(key)){ dup++; continue; }
    seen.add(key);
    state.tx.push({id: uid(), date, desc, amount: Math.round(amt * 100) / 100, cat: state.descCats[normDesc(desc)] || ""});
    added++; last = date;
  }
  if (last) ui.month = last.slice(0, 7);
  return {kind: "ok", text: `Imported ${added} purchase${added === 1 ? "" : "s"}.${dup ? ` Skipped ${dup} already logged.` : ""}${skipped ? ` Skipped ${skipped} income or unreadable rows.` : ""} Set categories for any marked Uncategorized.`};
}
$("#csvfile").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  ui.flash = importCSV(await f.text()); ui.tab = "spending"; changed(false); render();
});
/* ---------- backups ---------- */
$("#backupfile").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const box = JSON.parse(await f.text());
    if (!box || box.app !== "runway" || !box.ct) throw new Error("format");
    const key = await deriveKey(ui.backupPass || "", unb64(box.salt), box.iter || ITER);
    const data = await unseal(key, box);
    state = migrate(data); await writeNow();
    ui.flash = {kind: "ok", text: "Backup restored."}; ui.backupPass = ""; render();
  } catch(err){
    ui.flash = {kind: "", text: err && err.message === "format" ? "That file isn't a Runway backup." : "Couldn't open that backup. Check the passcode it was made with."}; render();
  }
});
async function exportBackup(){
  await flush();
  const box = await seal(session.key, session.salt, session.iter, state);
  const data = JSON.stringify(box), filename = `runway-backup-${todayISO()}.json`;
  const file = new File([data], filename, {type: "application/json"});
  try {
    if (navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: "Runway backup"}); return; }
  } catch(e){ if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- vault: encryption at rest ---------- */
const VAULT = "runway-vault-v1", FAILS = "runway-fails", ITER = 600000;
const te = new TextEncoder(), td = new TextDecoder();
function b64(buf){ const a = new Uint8Array(buf); let s = ""; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations: iter, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]);
}
async function seal(key, salt, iter, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, te.encode(JSON.stringify(obj)));
  return {app: "runway", v: 1, iter, salt: b64(salt), iv: b64(iv), ct: b64(ct)};
}
async function unseal(key, box){
  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: unb64(box.iv)}, key, unb64(box.ct));
  return JSON.parse(td.decode(pt));
}
let session = null, saveTimer = null, hiddenAt = 0, lastActive = Date.now(), deferredPrompt = null;
const setStatus = t => { const el = $("#status"); if (el) el.textContent = t; };
const readVault = () => { try { return JSON.parse(localStorage.getItem(VAULT)); } catch(e){ return null; } };
async function writeNow(){
  if (!session || !state) return;
  state.updatedAt = Date.now();
  try { localStorage.setItem(VAULT, JSON.stringify(await seal(session.key, session.salt, session.iter, state))); setStatus("Encrypted on this device"); }
  catch(e){ setStatus("Couldn't save. Device storage may be full."); }
}
function persist(){ if (!session) return; clearTimeout(saveTimer); setStatus("Saving"); saveTimer = setTimeout(() => { saveTimer = null; writeNow(); }, 350); }
async function flush(){ if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; await writeNow(); } }
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function fails(){ try { return JSON.parse(localStorage.getItem(FAILS)) || {n: 0, until: 0}; } catch(e){ return {n: 0, until: 0}; } }
function recordFail(){
  const f = fails(); f.n++;
  if (f.n >= 5) f.until = Date.now() + Math.min(15 * 60, 30 * Math.pow(2, f.n - 5)) * 1000;
  localStorage.setItem(FAILS, JSON.stringify(f));
  return f.until > Date.now() ? Math.ceil((f.until - Date.now()) / 1000) : 0;
}

/* ---------- lock screen ---------- */
function showGate(mode, msg = ""){
  ui.gate = mode;
  document.body.classList.add("locked");
  $("#view").innerHTML = ""; $("#tabs").innerHTML = ""; $("#bottomnav").innerHTML = "";
  const g = $("#gate"); g.hidden = false;
  const logo = `<img src="icon-192.png" alt="">`;
  const err = `<p class="err" role="alert">${esc(msg)}</p>`;
  if (mode === "unlock"){
    g.innerHTML = `<div class="gatebox">${logo}<h1>Runway</h1><p>Enter your passcode to open your finances.</p>
      <span class="box"><input id="g-pass" type="password" autocomplete="current-password" placeholder="Passcode" aria-label="Passcode" data-genter="unlock"></span>
      <button class="btn" data-gate="unlock">Unlock</button>${err}
      <button class="linkbtn" data-gate="forgot">Forgot passcode?</button></div>`;
  } else if (mode === "install"){
    g.innerHTML = `<div class="gatebox">${logo}<h1>Install first</h1><p>Installed apps keep their own private storage, so set up Runway from the app icon, not from this browser tab.</p>
      ${isIOS ? `<ol class="steps"><li>Tap the Share button in Safari</li><li>Choose Add to Home Screen</li><li>Open Runway from your home screen</li></ol>` : deferredPrompt ? `<button class="btn" data-gate="install">Install app</button>` : `<ol class="steps"><li>Chrome or Edge: click the install icon in the address bar</li><li>Safari on Mac: File, then Add to Dock</li><li>Open Runway from the new app icon</li></ol>`}
      <button class="linkbtn" data-gate="setupHere">Set up in this browser anyway</button></div>`;
  } else if (mode === "setup"){
    g.innerHTML = `<div class="gatebox">${logo}<h1>Create a passcode</h1><p>It encrypts everything you enter on this device. It can't be recovered if you forget it, so pick something you'll remember. Longer is stronger.</p>
      <span class="box"><input id="g-new" type="password" autocomplete="new-password" placeholder="New passcode, at least 6 characters" aria-label="New passcode"></span>
      <span class="box"><input id="g-new2" type="password" autocomplete="new-password" placeholder="Confirm passcode" aria-label="Confirm passcode" data-genter="create"></span>
      <button class="btn" data-gate="create">Create passcode</button>${err}
      <button class="linkbtn" data-gate="restore">Restore from a backup instead</button></div>`;
  } else if (mode === "restore"){
    g.innerHTML = `<div class="gatebox">${logo}<h1>Restore a backup</h1><p>Choose a Runway backup file and enter the passcode it was made with. That passcode becomes your passcode here.</p>
      <span class="box"><input id="g-file" type="file" accept=".json,application/json" aria-label="Backup file"></span>
      <span class="box"><input id="g-bpass" type="password" autocomplete="off" placeholder="Backup passcode" aria-label="Backup passcode" data-genter="doRestore"></span>
      <button class="btn" data-gate="doRestore">Restore</button>${err}
      <button class="linkbtn" data-gate="setupHere">Start fresh instead</button></div>`;
  }
  const first = g.querySelector("input"); if (first && first.type !== "file") setTimeout(() => first.focus(), 50);
}
function busy(on){ const b = $("#gate .btn"); if (b){ b.disabled = on; b.textContent = on ? "Working" : b.dataset.label || b.textContent; } }
function openApp(){
  document.body.classList.remove("locked"); $("#gate").hidden = true; $("#gate").innerHTML = "";
  if (ui.setup == null) ui.tab = "overview"; ui.flash = null; lastActive = Date.now(); render(); setStatus("Encrypted on this device");
}
async function lockApp(){
  if (!session) return;
  closeSheet(); $("#toast").classList.remove("show");
  await flush(); session = null; state = null; showGate("unlock");
}
async function gateAction(name){
  if (name === "unlock"){
    const box = readVault(); if (!box) return showGate("setup");
    const f = fails(); if (f.until > Date.now()) return showGate("unlock", `Too many tries. Wait ${Math.ceil((f.until - Date.now()) / 1000)} seconds.`);
    const pass = $("#g-pass").value; if (!pass) return;
    busy(true);
    try {
      const salt = unb64(box.salt), iter = box.iter || ITER, key = await deriveKey(pass, salt, iter);
      const data = await unseal(key, box);
      session = {key, salt, iter}; localStorage.removeItem(FAILS); state = migrate(data); openApp();
    } catch(e){ const w = recordFail(); showGate("unlock", w ? `Wrong passcode. Wait ${w} seconds before trying again.` : "Wrong passcode. Try again."); }
  } else if (name === "create"){
    const a = $("#g-new").value, b = $("#g-new2").value;
    if (a.length < 6) return showGate("setup", "Use at least 6 characters.");
    if (a !== b) return showGate("setup", "Those passcodes don't match.");
    busy(true);
    const salt = crypto.getRandomValues(new Uint8Array(16)), key = await deriveKey(a, salt, ITER);
    session = {key, salt, iter: ITER}; state = blank(); ui.setup = 0; ui.setupMin = 0; await writeNow();
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
    openApp();
  } else if (name === "forgot"){
    if (confirm("Without your passcode, your data can't be opened. Erase Runway on this device and start over? You can restore a backup afterward if you remember its passcode.")){
      localStorage.removeItem(VAULT); localStorage.removeItem(FAILS); showGate("setup");
    }
  } else if (name === "restore") showGate("restore");
  else if (name === "setupHere") showGate("setup");
  else if (name === "install"){ if (deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.finally(() => { deferredPrompt = null; }); } }
  else if (name === "doRestore"){
    const file = $("#g-file").files[0], pass = $("#g-bpass").value;
    if (!file || !pass) return showGate("restore", "Choose a file and enter its passcode.");
    busy(true);
    try {
      const box = JSON.parse(await file.text()); if (!box || box.app !== "runway") throw 0;
      const salt = unb64(box.salt), iter = box.iter || ITER, key = await deriveKey(pass, salt, iter);
      const data = await unseal(key, box);
      session = {key, salt, iter}; state = migrate(data); await writeNow(); openApp();
    } catch(e){ showGate("restore", "Couldn't open that backup. Check the file and its passcode."); }
  }
}
async function changePass(){
  const o = $("#cp-old").value, n = $("#cp-new").value, n2 = $("#cp-new2").value;
  const fail = t => { ui.flash = {kind: "", text: t}; render(); };
  if (n.length < 6) return fail("Use at least 6 characters for the new passcode.");
  if (n !== n2) return fail("The new passcodes don't match.");
  try { await flush(); const box = readVault(); const k = await deriveKey(o, session.salt, session.iter); await unseal(k, box); }
  catch(e){ return fail("Current passcode is wrong."); }
  const salt = crypto.getRandomValues(new Uint8Array(16));
  session = {key: await deriveKey(n, salt, ITER), salt, iter: ITER};
  await writeNow();
  ui.flash = {kind: "ok", text: "Passcode changed. Older backups still use the passcode they were made with."}; render();
}
document.addEventListener("click", e => { const b = e.target.closest("[data-gate]"); if (b) gateAction(b.dataset.gate); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.genter){ e.preventDefault(); gateAction(e.target.dataset.genter); } });

/* ---------- auto lock ---------- */
const autoMs = () => Math.max(1, num(state && state.settings.autoLock) || 5) * 60000;
["pointerdown", "keydown", "touchstart", "scroll"].forEach(ev => document.addEventListener(ev, () => { lastActive = Date.now(); }, {passive: true}));
setInterval(() => { if (session && Date.now() - lastActive > autoMs()) lockApp(); }, 15000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden){ hiddenAt = Date.now(); flush(); }
  else if (session && hiddenAt && Date.now() - hiddenAt > Math.min(autoMs(), 60000)) lockApp();
});
window.addEventListener("pagehide", () => { flush(); });
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; if (session) render(); else if (ui.gate === "install") showGate("install"); });
window.addEventListener("appinstalled", () => { deferredPrompt = null; if (session) render(); });

/* ---------- start ---------- */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("./sw.js").catch(() => {});
if (readVault()) showGate("unlock");
else showGate(isStandalone() ? "setup" : "install");
</script>
